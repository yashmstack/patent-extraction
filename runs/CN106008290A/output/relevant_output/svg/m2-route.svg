<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" role="img" aria-labelledby="m2t m2d"><title id="m2t">The two-step route to tembotrione disclosed in CN106008290A</title><desc id="m2d">A linear chain of two reaction steps from methyl 2-chloro-3-bromomethyl-4-(methylsulfonyl)benzoate to tembotrione. Each step box gives the step number, the transformation and the stated yield. Steps flagged as one-pot are marked with a double outline and the word one-pot. Steps whose stated arithmetic does not close are marked with a warning triangle and the word check.</desc><defs><marker id="m2arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><pattern id="m2hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5c5c5c" stroke-width="2.2"/></pattern></defs><rect width="1000" height="700" fill="#ffffff"/><text x="500" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#1a1a1a" text-anchor="middle">CN106008290A, patent scope: two steps to tembotrione</text><text x="500" y="51" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">Yields as printed in the patent. Two steps carry arithmetic that does not close.</text><rect x="34" y="96" width="224" height="96" rx="6" fill="#fdf3ee" fill-opacity="1" stroke="#D55E00" stroke-width="2.2"/><rect x="38" y="100" width="216" height="88" rx="4" fill="none" fill-opacity="1" stroke="#009E73" stroke-width="1.0"/><circle cx="56" cy="118" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="56" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="160.0" y="122" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">Williamson ether</text><text x="160.0" y="135" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">synthesis</text><text x="146.0" y="154" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">sodium hydroxide, hydrochloric</text><text x="146.0" y="166" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">acid, N,N-dimethyl...</text><text x="246" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#D55E00" text-anchor="end">91%</text><text x="108" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#009E73" text-anchor="start">one-pot</text><polygon points="46,186 55,171 64,186" fill="#ffffff" stroke="#D55E00" stroke-width="1.6"/><text x="55" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#D55E00" text-anchor="middle">!</text><text x="70" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#D55E00" text-anchor="start">check</text><rect x="276" y="96" width="224" height="96" rx="6" fill="#fdf3ee" fill-opacity="1" stroke="#D55E00" stroke-width="1.6"/><circle cx="298" cy="118" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="298" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="402.0" y="122" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">acylation</text><text x="388.0" y="154" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">CDI, triethylamine,</text><text x="388.0" y="166" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">1,2-dichloroethane, 5 C</text><text x="488" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#D55E00" text-anchor="end">86.3%</text><polygon points="288,186 297,171 306,186" fill="#ffffff" stroke="#D55E00" stroke-width="1.6"/><text x="297" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#D55E00" text-anchor="middle">!</text><text x="312" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#D55E00" text-anchor="start">check</text><line x1="260" y1="144.0" x2="272" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><rect x="270" y="218" width="236" height="47" rx="6" fill="#efe6f1" fill-opacity="1" stroke="#CC79A7" stroke-width="2"/><text x="388.0" y="236" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">tembotrione</text><text x="388.0" y="255" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">the target</text><line x1="388.0" y1="196" x2="388.0" y2="214" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><text x="60" y="277" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="normal" fill="#5c5c5c" text-anchor="start">cumulative yield across all two steps, as printed:</text><text x="60" y="299" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">0.91 x 0.86  =  78.53%</text><text x="60" y="321" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">Generated from pathways.json and reactions.json. No route diagram has been hand-authored for this</text><text x="60" y="335" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">patent.</text><rect x="34" y="610" width="932" height="80" rx="5" fill="#f6f6f6" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="632" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">Every box on this diagram is read out of the gold annotation, not typed beside it: the transformation is the</text><text x="44" y="647" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">reaction's named_reaction or its class, the conditions are its reagents and solvent, the yield is its stated</text><text x="44" y="662" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">product_yield_pct, and a step is flagged when the annotation put a validation_flag on it. Nothing here is a</text><text x="44" y="677" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">second opinion about the chemistry. For a richer figure, add an entry to HAND_DRAWN_ROUTES in make_svgs.py.</text></svg>