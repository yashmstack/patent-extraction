<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540"
     font-family="Helvetica, Arial, sans-serif" role="img"
     aria-label="Two front-end paths converging. The written text reaches the acetyl sulfone in two steps using methanesulfonyl chloride. The drawn scheme reaches it in three, via a thioether and an undrawn oxidation. After they converge, six further steps are identical in all four tellings.">
  <title>One route, four tellings: where they diverge</title>
  <desc>The three written tellings (claims, summary, example 1) reach
  2-chloro-3-acetyl-6-methylsulfonyltoluene in two steps via methanesulfonyl chloride.
  The drawn scheme reaches the same compound in three steps via a methylthio intermediate
  and an oxidation drawn with no arrow and no reagent. From that point all four tellings
  share six identical steps to tembotrione.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/>
    </marker>
  </defs>

  <rect width="980" height="540" fill="#ffffff"/>
  <text x="28" y="36" font-size="19" font-weight="bold" fill="#000000">One route, told four times. The four disagree in exactly one place.</text>
  <text x="28" y="58" font-size="13" fill="#333333">33 reaction records = 8 steps described by 3 written tellings, plus a 9-step drawn scheme. Only the front end differs.</text>

  <!-- start -->
  <rect x="28" y="150" width="112" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="84" y="172" font-size="11" text-anchor="middle" fill="#000000">2-chlorotoluene</text>
  <text x="84" y="188" font-size="10" text-anchor="middle" fill="#555555">(text) / 2,6-di (drawn)</text>

  <!-- WRITTEN PATH (top) -->
  <text x="176" y="96" font-size="12" font-weight="bold" fill="#0072B2">WRITTEN: claims, summary, example 1  (agree with each other)</text>
  <line x1="140" y1="164" x2="196" y2="128" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="150" y="120" font-size="10" fill="#0072B2">MsCl</text>

  <rect x="200" y="104" width="132" height="48" rx="4" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
  <text x="266" y="124" font-size="10.5" text-anchor="middle" fill="#000000">2-chloro-6-</text>
  <text x="266" y="138" font-size="10.5" text-anchor="middle" fill="#000000">methylsulfonyltoluene</text>
  <text x="266" y="98" font-size="10" text-anchor="middle" font-weight="bold" fill="#0072B2">step 1</text>

  <line x1="332" y1="128" x2="392" y2="128" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="344" y="120" font-size="10" fill="#0072B2">AcCl</text>

  <!-- DRAWN PATH (bottom) -->
  <text x="176" y="286" font-size="12" font-weight="bold" fill="#D55E00">DRAWN SCHEME at line 174  (disagrees, and the patent says so at [0031])</text>
  <line x1="140" y1="188" x2="196" y2="224" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arR)"/>
  <text x="142" y="216" font-size="10" fill="#D55E00">NaSMe</text>

  <rect x="200" y="200" width="132" height="48" rx="4" fill="#ffffff" stroke="#D55E00" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="266" y="220" font-size="10.5" text-anchor="middle" fill="#000000">methyl-THIO</text>
  <text x="266" y="234" font-size="10.5" text-anchor="middle" fill="#000000">toluene</text>
  <text x="266" y="264" font-size="10" text-anchor="middle" font-weight="bold" fill="#D55E00">step 1</text>

  <line x1="332" y1="224" x2="392" y2="224" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arR)"/>
  <text x="344" y="216" font-size="10" fill="#D55E00">AcCl</text>

  <rect x="396" y="200" width="132" height="48" rx="4" fill="#ffffff" stroke="#D55E00" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="462" y="220" font-size="10.5" text-anchor="middle" fill="#000000">acetyl methyl-THIO</text>
  <text x="462" y="234" font-size="10.5" text-anchor="middle" fill="#000000">toluene</text>
  <text x="462" y="264" font-size="10" text-anchor="middle" font-weight="bold" fill="#D55E00">step 2</text>

  <!-- the phantom oxidation -->
  <line x1="528" y1="224" x2="586" y2="190" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="2 3" marker-end="url(#arR)"/>
  <rect x="452" y="292" width="252" height="46" rx="4" fill="#F0E442" stroke="#000000" stroke-width="1.5"/>
  <text x="578" y="310" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#000000">step 3: SCH3 becomes SO2CH3</text>
  <text x="578" y="326" font-size="10.5" text-anchor="middle" fill="#000000">no arrow, no reagent, across a line wrap</text>
  <line x1="560" y1="292" x2="556" y2="200" stroke="#000000" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- convergence -->
  <rect x="590" y="140" width="150" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="665" y="160" font-size="10.5" text-anchor="middle" fill="#000000">2-chloro-3-acetyl-6-</text>
  <text x="665" y="174" font-size="10.5" text-anchor="middle" fill="#000000">methylsulfonyltoluene</text>
  <text x="665" y="192" font-size="10" text-anchor="middle" font-weight="bold" fill="#000000">BOTH PATHS MEET</text>
  <line x1="528" y1="128" x2="586" y2="160" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="437" y="128" font-size="10" text-anchor="middle" font-weight="bold" fill="#0072B2">step 2</text>

  <!-- shared tail -->
  <line x1="740" y1="170" x2="796" y2="170" stroke="#000000" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="800" y="140" width="152" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="876" y="164" font-size="11" text-anchor="middle" font-weight="bold" fill="#000000">6 further steps</text>
  <text x="876" y="180" font-size="10.5" text-anchor="middle" fill="#000000">identical in all four</text>
  <text x="876" y="194" font-size="10.5" text-anchor="middle" fill="#000000">to tembotrione</text>

  <!-- footer -->
  <line x1="28" y1="366" x2="952" y2="366" stroke="#cccccc" stroke-width="1"/>
  <text x="28" y="392" font-size="14" font-weight="bold" fill="#000000">Why this matters more than the defect it found</text>
  <text x="28" y="414" font-size="13" fill="#000000">The document describes the same route four times, so any field where the tellings disagree is a place to look. That check</text>
  <text x="28" y="432" font-size="13" fill="#000000">needs no chemistry, no ground truth, no external database and no second model. It is the document checked against itself.</text>

  <rect x="28" y="448" width="924" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="42" y="470" font-size="12.5" font-weight="bold" fill="#000000">Two cautions before building on it:</text>
  <text x="42" y="490" font-size="12.5" fill="#000000">Disagreement is strong evidence; agreement is weak. Four tellings from one model on one document can agree and all be wrong.</text>
  <text x="42" y="508" font-size="12.5" fill="#000000">And "9 versus 8" says where to look, not what is wrong: a numbering slip would have produced the identical count.</text>
</svg>
