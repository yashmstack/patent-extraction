<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" role="img" aria-labelledby="m5t m5d"><title id="m5t">What each text-recovery route recovers from a scanned patent page</title><desc id="m5d">Three routes compared on page 4, the page carrying the whole synthetic route as drawn structures. The PDF text layer yields nothing. Apple's Vision framework yields prose but reduces every scheme to orphaned fragments. A vision model yields prose, structures and the reagents on each arrow. Filled circles mark what a route recovers, hollow circles with a cross mark what it loses.</desc><defs><marker id="m5arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><pattern id="m5hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5c5c5c" stroke-width="2.2"/></pattern></defs><rect width="980" height="620" fill="#ffffff"/><text x="490" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#1a1a1a" text-anchor="middle">Why OCR alone loses this patent</text><text x="490" y="51" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">Measured on page 4, which carries the entire one-step route as structural formulae.</text><text x="446.0" y="96" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">Chinese prose</text><text x="594.0" y="96" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">structures</text><text x="742.0" y="96" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">substituent</text><text x="742.0" y="109" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">positions</text><text x="890.0" y="96" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">reagents above</text><text x="890.0" y="109" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">vs below arrow</text><rect x="30" y="140" width="330" height="92" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="46" y="166" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">PDF text layer</text><text x="46" y="185" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">pdftotext equivalent</text><text x="46" y="208" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">0 characters. All 9 pages are scans.</text><circle cx="446.0" cy="186" r="15" fill="#ffffff" stroke="#5c5c5c" stroke-width="1.6"/><line x1="440.0" y1="180" x2="452.0" y2="192" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><line x1="452.0" y1="180" x2="440.0" y2="192" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><circle cx="594.0" cy="186" r="15" fill="#ffffff" stroke="#5c5c5c" stroke-width="1.6"/><line x1="588.0" y1="180" x2="600.0" y2="192" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><line x1="600.0" y1="180" x2="588.0" y2="192" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><circle cx="742.0" cy="186" r="15" fill="#ffffff" stroke="#5c5c5c" stroke-width="1.6"/><line x1="736.0" y1="180" x2="748.0" y2="192" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><line x1="748.0" y1="180" x2="736.0" y2="192" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><circle cx="890.0" cy="186" r="15" fill="#ffffff" stroke="#5c5c5c" stroke-width="1.6"/><line x1="884.0" y1="180" x2="896.0" y2="192" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><line x1="896.0" y1="180" x2="884.0" y2="192" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><rect x="30" y="258" width="330" height="92" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#E69F00" stroke-width="2"/><text x="46" y="284" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Apple Vision OCR</text><text x="46" y="303" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">zh-Hans + en-US, accurate mode</text><text x="46" y="326" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">60 lines on p6: 36 low-confidence, 37 of six</text><text x="46" y="339" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">characters or fewer.</text><circle cx="446.0" cy="304" r="15" fill="#E69F00" stroke="#1a1a1a" stroke-width="1.4"/><path d="M 439.0 304 L 444.0 310 L 453.0 298" fill="none" stroke="#ffffff" stroke-width="2.6"/><circle cx="594.0" cy="304" r="15" fill="#ffffff" stroke="#5c5c5c" stroke-width="1.6"/><line x1="588.0" y1="298" x2="600.0" y2="310" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><line x1="600.0" y1="298" x2="588.0" y2="310" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><circle cx="742.0" cy="304" r="15" fill="#ffffff" stroke="#5c5c5c" stroke-width="1.6"/><line x1="736.0" y1="298" x2="748.0" y2="310" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><line x1="748.0" y1="298" x2="736.0" y2="310" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><circle cx="890.0" cy="304" r="15" fill="#ffffff" stroke="#5c5c5c" stroke-width="1.6"/><line x1="884.0" y1="298" x2="896.0" y2="310" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><line x1="896.0" y1="298" x2="884.0" y2="310" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"/><rect x="30" y="376" width="330" height="92" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#009E73" stroke-width="2"/><text x="46" y="402" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Vision model on the page</text><text x="46" y="421" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">pass V, 4 agents in parallel</text><text x="46" y="444" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">Prose, ring systems, substituent positions,</text><text x="46" y="457" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">and reagents per arrow.</text><circle cx="446.0" cy="422" r="15" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><path d="M 439.0 422 L 444.0 428 L 453.0 416" fill="none" stroke="#ffffff" stroke-width="2.6"/><circle cx="594.0" cy="422" r="15" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><path d="M 587.0 422 L 592.0 428 L 601.0 416" fill="none" stroke="#ffffff" stroke-width="2.6"/><circle cx="742.0" cy="422" r="15" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><path d="M 735.0 422 L 740.0 428 L 749.0 416" fill="none" stroke="#ffffff" stroke-width="2.6"/><circle cx="890.0" cy="422" r="15" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><path d="M 883.0 422 L 888.0 428 L 897.0 416" fill="none" stroke="#ffffff" stroke-width="2.6"/><text x="30" y="508" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="start">The specific damage Apple Vision did to prose it did read:</text><text x="30" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">环己烷-1,3-二酮   read as   环己烷一 1，3-二酮</text><text x="30" y="550" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">cyclohexane-1,3-dione, with the hyphen replaced by the Chinese numeral one.</text><rect x="500" y="530" width="450" height="80" rx="5" fill="#f6f6f6" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/><text x="510" y="552" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">A tick is not a quality claim. Pass V can still</text><text x="510" y="567" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">misread a structure, which is why A5 re-opens the</text><text x="510" y="582" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">page images to audit it, and why every SMILES is</text><text x="510" y="597" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">RDKit-validated before it reaches a prompt.</text></svg>