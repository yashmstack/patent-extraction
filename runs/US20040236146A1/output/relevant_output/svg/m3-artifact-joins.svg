<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="100%" role="img" aria-labelledby="m3t m3d"><title id="m3t">The four artifacts and the keys that join them</title><desc id="m3d">Four artifact boxes. compounds.json and reactions.json join into pathways.json by compound_uuid and reaction_uuid. All three roll up into patent.json. Each join key is labelled on its arrow. Keys drawn with a hatched fill are computed by finalise.py rather than emitted by a prompt.</desc><defs><marker id="m3arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><pattern id="m3hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5c5c5c" stroke-width="2.2"/></pattern></defs><rect width="980" height="720" fill="#ffffff"/><text x="490" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#1a1a1a" text-anchor="middle">Four artifacts, and the keys that join them</text><text x="490" y="51" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">Every key is a deterministic function of extracted content, so none of them is asked of the model.</text><rect x="40" y="96" width="258" height="210" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><rect x="40" y="96" width="258" height="32" rx="6" fill="#0072B2" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="52" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">compounds.json</text><text x="286" y="117" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">A1</text><rect x="50" y="137" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="66" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">id</text><rect x="50" y="156" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="66" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">compound_uuid</text><circle cx="54.5" cy="179.5" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="66" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">identifier</text><text x="66" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">role, quantity</text><text x="66" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">nmr, melting_point</text><text x="66" y="243" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">tags[]</text><text x="66" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">notes</text><rect x="360" y="96" width="258" height="210" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#009E73" stroke-width="2"/><rect x="360" y="96" width="258" height="32" rx="6" fill="#009E73" fill-opacity="1" stroke="#009E73" stroke-width="2"/><text x="372" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">reactions.json</text><text x="606" y="117" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">A2</text><rect x="370" y="137" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="386" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">id</text><rect x="370" y="156" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="386" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">reaction_uuid</text><circle cx="374.5" cy="179.5" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="386" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">reaction_id</text><circle cx="374.5" cy="198.5" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="386" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">compounds[]</text><text x="386" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">conditions, workup</text><text x="386" y="243" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">validation_flags[]</text><text x="386" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">tags[]</text><rect x="200" y="372" width="258" height="176" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#E69F00" stroke-width="2"/><rect x="200" y="372" width="258" height="32" rx="6" fill="#E69F00" fill-opacity="1" stroke="#E69F00" stroke-width="2"/><text x="212" y="393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">pathways.json</text><text x="446" y="393" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">A3</text><rect x="210" y="413" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="226" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">pathway_uuid</text><circle cx="214.5" cy="436.5" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="226" y="443" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">ksm, product</text><rect x="210" y="451" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="226" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">steps[].reaction_uuid</text><text x="226" y="481" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">overall_yield_pct</text><text x="226" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">honest_uncertainty_flags</text><rect x="660" y="300" width="280" height="210" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#CC79A7" stroke-width="2"/><rect x="660" y="300" width="280" height="32" rx="6" fill="#CC79A7" fill-opacity="1" stroke="#CC79A7" stroke-width="2"/><text x="672" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">patent.json</text><text x="928" y="321" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">A4</text><rect x="670" y="341" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="686" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">patent_uuid</text><rect x="670" y="360" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="686" y="371" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">bibliographic.family_id</text><rect x="670" y="379" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="686" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#1a1a1a" text-anchor="start">extraction_rollup</text><text x="686" y="409" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">patent_summary</text><text x="686" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">novelty_claims</text><text x="686" y="447" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="normal" fill="#5c5c5c" text-anchor="start">tags[] union of all</text><path d="M 169 310 C 169 344, 240 342, 286 368" fill="none" stroke="#0072B2" stroke-width="1.7" marker-end="url(#m3arrow)"/><text x="120" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#0072B2" text-anchor="start">compound_uuid</text><path d="M 489 310 C 489 344, 420 342, 378 368" fill="none" stroke="#009E73" stroke-width="1.7" marker-end="url(#m3arrow)"/><text x="520" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#009E73" text-anchor="start">reaction_uuid</text><path d="M 618 200 C 660 200, 664 268, 690 296" fill="none" stroke="#5c5c5c" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#m3arrow)"/><path d="M 458 430 C 560 430, 600 420, 656 412" fill="none" stroke="#5c5c5c" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#m3arrow)"/><text x="566" y="468" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="middle">rollup: counts, section_summary,</text><text x="566" y="483" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="middle">scale_distribution, best yield</text><rect x="40" y="566" width="420" height="88" rx="5" fill="#f6f6f6" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/><text x="54" y="588" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#5c5c5c" text-anchor="start">legend</text><rect x="56" y="600" width="9" height="9" rx="2" fill="url(#m3hatch)" fill-opacity="1" stroke="#1a1a1a" stroke-width="1"/><text x="74" y="609" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">computed by finalise.py, never asked of a prompt</text><circle cx="60.5" cy="627.5" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="74" y="632" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">human-readable handle emitted by the prompt</text><rect x="480" y="615" width="460" height="95" rx="5" fill="#f6f6f6" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/><text x="490" y="637" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">PersistentRecordBuilder derives every id and uuid from</text><text x="490" y="652" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">(patent_id, identifier) or (patent_id, reaction_id) via UUIDv5</text><text x="490" y="667" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">over the DNS namespace. finalise.py reproduces that exactly, so</text><text x="490" y="682" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">the gold artifacts key-join with production output rather than</text><text x="490" y="697" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">sitting alongside it in a parallel namespace.</text></svg>