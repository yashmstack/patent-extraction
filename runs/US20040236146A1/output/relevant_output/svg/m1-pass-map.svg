<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" width="100%" role="img" aria-labelledby="m1t m1d"><title id="m1t">Production extraction passes mapped onto the manual annotation passes</title><desc id="m1d">Two columns. The left column lists LiteratureIQ's seven production passes. The right lists the six manual annotation passes. Arrows show which production passes collapse into which manual pass. A5 verification has no production counterpart and is drawn with a dashed border.</desc><defs><marker id="m1arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><pattern id="m1hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5c5c5c" stroke-width="2.2"/></pattern></defs><rect width="980" height="900" fill="#ffffff"/><text x="490" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#1a1a1a" text-anchor="middle">Twelve production steps collapse into seven manual passes</text><text x="490" y="51" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">Same artifacts out, same enriched-markdown input shape. V replaces the whole document-prep phase.</text><text x="190" y="88" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#0072B2" text-anchor="middle">LiteratureIQ, in production</text><text x="760" y="88" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#E69F00" text-anchor="middle">manual_annotations, this pack</text><rect x="40" y="108" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">2. Mistral OCR</text><text x="56" y="142" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">PDF pages to markdown</text><rect x="40" y="162" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">3. Translation LLM</text><text x="56" y="196" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">zh to en, per page</text><rect x="40" y="216" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">4. MolScribe / RxnScribe</text><text x="56" y="250" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">drawings to SMILES</text><rect x="40" y="270" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="289" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">5. Enriched markdown</text><text x="56" y="304" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">inline IMAGE_EXTRACT</text><rect x="40" y="324" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">section-discovery</text><text x="56" y="358" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">chunked, merged</text><rect x="40" y="378" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="397" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">M1 molecule pass 1</text><text x="56" y="412" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">over-collect</text><rect x="40" y="432" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="451" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">M2 molecule pass 2</text><text x="56" y="466" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">resolve + tag</text><rect x="40" y="486" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="505" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">R1 reaction pass 1</text><text x="56" y="520" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">step boundaries</text><rect x="40" y="540" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="559" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">R2 reaction pass 2</text><text x="56" y="574" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">per step, N calls</text><rect x="40" y="594" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="613" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">R3 reaction pass 3</text><text x="56" y="628" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">classify + link</text><rect x="40" y="648" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="667" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">PathwaysBuilder</text><text x="56" y="682" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">deterministic Java</text><rect x="40" y="702" width="300" height="44" rx="6" fill="#eef5fb" fill-opacity="1" stroke="#0072B2" stroke-width="1.4"/><text x="56" y="721" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="start">patent-tagger</text><text x="56" y="736" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">narrative + tags</text><rect x="620" y="118" width="320" height="62" rx="6" fill="#fdf5e8" fill-opacity="1" stroke="#D55E00" stroke-width="1.8"/><circle cx="650" cy="140" r="13" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><text x="650" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">V</text><text x="674" y="144" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a" text-anchor="start">page vision read</text><text x="674" y="164" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">4 in parallel</text><rect x="620" y="202" width="320" height="62" rx="6" fill="#fdf5e8" fill-opacity="1" stroke="#E69F00" stroke-width="1.8"/><circle cx="650" cy="224" r="13" fill="#E69F00" stroke="#1a1a1a" stroke-width="1.4"/><text x="650" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">A0</text><text x="674" y="228" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a" text-anchor="start">section map</text><text x="674" y="248" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">1 call</text><rect x="620" y="286" width="320" height="62" rx="6" fill="#fdf5e8" fill-opacity="1" stroke="#E69F00" stroke-width="1.8"/><circle cx="650" cy="308" r="13" fill="#E69F00" stroke="#1a1a1a" stroke-width="1.4"/><text x="650" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">A1</text><text x="674" y="312" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a" text-anchor="start">compounds</text><text x="674" y="332" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">per section</text><rect x="620" y="370" width="320" height="62" rx="6" fill="#fdf5e8" fill-opacity="1" stroke="#E69F00" stroke-width="1.8"/><circle cx="650" cy="392" r="13" fill="#E69F00" stroke="#1a1a1a" stroke-width="1.4"/><text x="650" y="396" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">A2</text><text x="674" y="396" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a" text-anchor="start">reactions</text><text x="674" y="416" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">per section</text><rect x="620" y="454" width="320" height="62" rx="6" fill="#fdf5e8" fill-opacity="1" stroke="#E69F00" stroke-width="1.8"/><circle cx="650" cy="476" r="13" fill="#E69F00" stroke="#1a1a1a" stroke-width="1.4"/><text x="650" y="480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">A3</text><text x="674" y="480" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a" text-anchor="start">pathways</text><text x="674" y="500" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">1 call</text><rect x="620" y="538" width="320" height="62" rx="6" fill="#fdf5e8" fill-opacity="1" stroke="#E69F00" stroke-width="1.8"/><circle cx="650" cy="560" r="13" fill="#E69F00" stroke="#1a1a1a" stroke-width="1.4"/><text x="650" y="564" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">A4</text><text x="674" y="564" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a" text-anchor="start">patent record</text><text x="674" y="584" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">1 call</text><rect x="620" y="622" width="320" height="62" rx="6" fill="#fdf5e8" fill-opacity="1" stroke="#E69F00" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="650" cy="644" r="13" fill="#E69F00" stroke="#1a1a1a" stroke-width="1.4"/><text x="650" y="648" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">A5</text><text x="674" y="648" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a" text-anchor="start">verification</text><text x="674" y="668" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="normal" fill="#5c5c5c" text-anchor="start">adversarial</text><path d="M 344 130.0 C 470 130.0, 500 149.0, 614 149.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 184.0 C 470 184.0, 500 149.0, 614 149.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 238.0 C 470 238.0, 500 149.0, 614 149.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 292.0 C 470 292.0, 500 149.0, 614 149.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 346.0 C 470 346.0, 500 233.0, 614 233.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 400.0 C 470 400.0, 500 317.0, 614 317.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 454.0 C 470 454.0, 500 317.0, 614 317.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 508.0 C 470 508.0, 500 401.0, 614 401.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 562.0 C 470 562.0, 500 401.0, 614 401.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 616.0 C 470 616.0, 500 401.0, 614 401.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 670.0 C 470 670.0, 500 485.0, 614 485.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><path d="M 344 724.0 C 470 724.0, 500 569.0, 614 569.0" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#m1arrow)"/><text x="600" y="657.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#D55E00" text-anchor="end">no counterpart</text><polygon points="606,647.0 618,653.0 606,659.0" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><rect x="40" y="795" width="900" height="95" rx="5" fill="#f6f6f6" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/><text x="50" y="817" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">V is not a shortcut. The PDF has no text layer at all, so OCR is mandatory, and the drawings carry the route: page 4 alone</text><text x="50" y="832" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">holds the whole synthesis as structural formulae. Apple Vision read the Chinese prose acceptably but returned only orphaned</text><text x="50" y="847" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">fragments for every scheme, so a vision model reads the rendered pages instead and emits the same [IMAGE_EXTRACT: ...] spans</text><text x="50" y="862" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">MolScribe and RxnScribe produce. Merging A1/A2 is safe only because this patent is 24 kB; production splits R2 per step to</text><text x="50" y="877" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">bound token cost, not to improve accuracy. A5 is the one genuine addition, and it re-opens the page images to check V.</text></svg>