<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" role="img" aria-labelledby="m4t m4d"><title id="m4t">Three kinds of field: model-emitted, computed, deliberately null</title><desc id="m4d">A reaction record's fields split into three groups. Model-emitted fields come from the A2 prompt. Computed fields are derived by finalise.py. Deliberately-null fields belong to a downstream enrichment service and are left empty so the gold set contains nothing extraction cannot produce.</desc><defs><marker id="m4arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><pattern id="m4hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5c5c5c" stroke-width="2.2"/></pattern></defs><rect width="960" height="560" fill="#ffffff"/><text x="480" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#1a1a1a" text-anchor="middle">Which fields the annotation is allowed to fill</text><text x="480" y="51" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">A gold set must not contain a field that extraction itself cannot produce.</text><rect x="30" y="88" width="280" height="372" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#009E73" stroke-width="2"/><rect x="30" y="88" width="280" height="34" rx="6" fill="#009E73" fill-opacity="1" stroke="#009E73" stroke-width="2"/><text x="170.0" y="110" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">emitted by the prompt</text><circle cx="54" cy="143" r="6" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><text x="72" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">reaction_id, step_index</text><circle cx="54" cy="181" r="6" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><text x="72" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">reaction_class, mechanism_type</text><circle cx="54" cy="219" r="6" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><text x="72" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">conditions.*, workup.*</text><circle cx="54" cy="257" r="6" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><text x="72" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">compounds[], reactant_names</text><circle cx="54" cy="295" r="6" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><text x="72" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">product_yield_pct</text><circle cx="54" cy="333" r="6" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><text x="72" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">precursor_step, linkage_confirmed</text><circle cx="54" cy="371" r="6" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><text x="72" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">validation_flags[], tags[]</text><circle cx="54" cy="409" r="6" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/><text x="72" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">procedure_text, notes</text><rect x="340" y="88" width="280" height="372" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><rect x="340" y="88" width="280" height="34" rx="6" fill="#0072B2" fill-opacity="1" stroke="#0072B2" stroke-width="2"/><text x="480.0" y="110" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">computed by finalise.py</text><rect x="358" y="137" width="12" height="12" rx="2" fill="#0072B2" fill-opacity="1" stroke="#1a1a1a" stroke-width="1.2"/><text x="382" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">id</text><rect x="358" y="175" width="12" height="12" rx="2" fill="#0072B2" fill-opacity="1" stroke="#1a1a1a" stroke-width="1.2"/><text x="382" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">reaction_uuid</text><rect x="358" y="213" width="12" height="12" rx="2" fill="#0072B2" fill-opacity="1" stroke="#1a1a1a" stroke-width="1.2"/><text x="382" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">pathway_uuid</text><rect x="358" y="251" width="12" height="12" rx="2" fill="#0072B2" fill-opacity="1" stroke="#1a1a1a" stroke-width="1.2"/><text x="382" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">compound_uuid</text><rect x="358" y="289" width="12" height="12" rx="2" fill="#0072B2" fill-opacity="1" stroke="#1a1a1a" stroke-width="1.2"/><text x="382" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">patent_uuid</text><rect x="358" y="327" width="12" height="12" rx="2" fill="#0072B2" fill-opacity="1" stroke="#1a1a1a" stroke-width="1.2"/><text x="382" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">extraction_rollup.*</text><rect x="358" y="365" width="12" height="12" rx="2" fill="#0072B2" fill-opacity="1" stroke="#1a1a1a" stroke-width="1.2"/><text x="382" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">patent tags: jurisdiction,</text><rect x="358" y="403" width="12" height="12" rx="2" fill="#0072B2" fill-opacity="1" stroke="#1a1a1a" stroke-width="1.2"/><text x="382" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">patent_family, assignee</text><rect x="650" y="88" width="280" height="372" rx="6" fill="#fbfbfb" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><rect x="650" y="88" width="280" height="34" rx="6" fill="#D55E00" fill-opacity="1" stroke="#D55E00" stroke-width="2"/><text x="790.0" y="110" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">deliberately left null</text><polygon points="667,149 674,136 681,149" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><text x="692" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">atom_mapped_rxn</text><polygon points="667,187 674,174 681,187" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><text x="692" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">template_r0 / r1 / r2</text><polygon points="667,225 674,212 681,225" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><text x="692" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">feasibility_score, yield_score</text><polygon points="667,263 674,250 681,263" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><text x="692" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">cost_score, safety_score</text><polygon points="667,301 674,288 681,301" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><text x="692" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">green_score, byproduct_score</text><polygon points="667,339 674,326 681,339" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><text x="692" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">confidence_score</text><polygon points="667,377 674,364 681,377" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><text x="692" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">reaction_vector</text><polygon points="667,415 674,402 681,415" fill="#D55E00" stroke="#1a1a1a" stroke-width="1.4"/><text x="692" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.3" font-weight="normal" fill="#1a1a1a" text-anchor="start">product_smiles, canonical_rxn</text><rect x="30" y="470" width="900" height="80" rx="5" fill="#f6f6f6" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/><text x="40" y="492" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">Shape carries the meaning as well as colour, so the three groups stay distinct in greyscale and for colourblind readers.</text><text x="40" y="507" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">The third column is the one people get wrong. Leaving enrichment fields null is not an omission - a reference that carries</text><text x="40" y="522" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">atom-mapped reactions or template hashes would score the enrichment service, not the extractor, and no prompt in this pack</text><text x="40" y="537" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">is capable of producing them honestly.</text></svg>