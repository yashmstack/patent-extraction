is</text><text x="146.0" y="344" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">sodium hydride, CF3CH2ONa,</text><text x="146.0" y="356" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">tetrahydrofuran</text><text x="246" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#D55E00" text-anchor="end">no yield</text><text x="108" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#009E73" text-anchor="start">one-pot</text><polygon points="46,376 55,361 64,376" fill="#ffffff" stroke="#D55E00" stroke-width="1.6"/><text x="55" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#D55E00" text-anchor="middle">!</text><text x="70" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#D55E00" text-anchor="start">check</text><rect x="276" y="286" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="1.6"/><circle cx="298" cy="308" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="298" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="402.0" y="312" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">other cross coupling</text><text x="388.0" y="344" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">water, triethylamine,</text><text x="388.0" y="356" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">1,4-dioxane, 80 C</text><text x="488" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">81.13%</text><rect x="518" y="286" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="1.6"/><circle cx="540" cy="308" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="540" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="644.0" y="312" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">halogenation</text><text x="630.0" y="344" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">thionyl chloride, 1,4-dioxane,</text><text x="630.0" y="356" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">55 C</text><text x="730" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">no yield</text><rect x="760" y="286" width="224" height="96" rx="6" fill="#fdf3ee" fill-opacity="1" stroke="#D55E00" stroke-width="1.6"/><circle cx="782" cy="308" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="782" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="886.0" y="312" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">ester formation</text><text x="872.0" y="344" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">triethylamine, 1,4-dioxane</text><text x="972" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#D55E00" text-anchor="end">no yield</text><polygon points="772,376 781,361 790,376" fill="#ffffff" stroke="#D55E00" stroke-width="1.6"/><text x="781" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#D55E00" text-anchor="middle">!</text><text x="796" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#D55E00" text-anchor="start">check</text><rect x="34" y="476" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="1.6"/><circle cx="56" cy="498" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="56" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">9</text><text x="160.0" y="502" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">acylation</text><text x="146.0" y="534" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">acetone cyanohydrin,</text><text x="146.0" y="546" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">hydrochloric acid, 60 C</text><text x="246" y="563" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">76.59%</text><line x1="260" y1="144.0" x2="272" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="502" y1="144.0" x2="514" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="744" y1="144.0" x2="756" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="260" y1="334.0" x2="272" y2="334.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="502" y1="334.0" x2="514" y2="334.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="744" y1="334.0" x2="756" y2="334.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><path d="M 872.0 196 L 872.0 220 L 146.0 220 L 146.0 280" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#m2arrow)"/><path d="M 872.0 386 L 872.0 410 L 146.0 410 L 146.0 470" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#m2arrow)"/><rect x="28" y="598" width="236" height="47" rx="6" fill="#efe6f1" fill-opacity="1" stroke="#CC79A7" stroke-width="2"/><text x="146.0" y="616" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">tembotrione</text><text x="146.0" y="635" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">the target</text><line x1="146.0" y1="576" x2="146.0" y2="594" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><text x="60" y="657" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="normal" fill="#5c5c5c" text-anchor="start">cumulative yield across all nine steps, as printed:</text><text x="60" y="679" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">not computable: 7 of 9 steps print no yield</text><text x="60" y="701" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">Generated from pathways.json and reactions.json. No route diagram has been hand-authored for this</text><text x="60" y="715" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">patent.</text><rect x="34" y="786" width="932" height="80" rx="5" fill="#f6f6f6" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="808" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">Every box on this diagram is read out of the gold annotation, not typed beside it: the transformation is the</text><text x="44" y="823" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">reaction's named_reaction or its class, the conditions are its reagents and solvent, the yield is its stated</text><text x="44" y="838" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">product_yield_pct, and a step is flagged when the annotation put a validation_flag on it. Nothing here is a</text><text x="44" y="853" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">second opinion about the chemistry. For a richer figure, add an entry to HAND_DRAWN_ROUTES in make_svgs.py.</text></svg>