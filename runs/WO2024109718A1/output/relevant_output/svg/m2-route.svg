<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 876" width="100%" role="img" aria-labelledby="m2t m2d"><title id="m2t">The nine-step route to tembotrione disclosed in WO2024109718A1</title><desc id="m2d">A linear chain of nine reaction steps from 3-chloro-2-methylaniline to tembotrione. Each step box gives the step number, the transformation and the stated yield. Steps flagged as one-pot are marked with a double outline and the word one-pot. Steps whose stated arithmetic does not close are marked with a warning triangle and the word check.</desc><defs><marker id="m2arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><pattern id="m2hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5c5c5c" stroke-width="2.2"/></pattern></defs><rect width="1000" height="876" fill="#ffffff"/><text x="500" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#1a1a1a" text-anchor="middle">WO2024109718A1, patent scope: nine steps to tembotrione</text><text x="500" y="51" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">Yields as printed in the patent. Four steps carry arithmetic that does not close.</text><rect x="34" y="96" width="224" height="96" rx="6" fill="#fdf3ee" fill-opacity="1" stroke="#D55E00" stroke-width="2.2"/><rect x="38" y="100" width="216" height="88" rx="4" fill="none" fill-opacity="1" stroke="#009E73" stroke-width="1.0"/><circle cx="56" cy="118" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="56" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="160.0" y="122" font-family="ui-sans-serif, -a